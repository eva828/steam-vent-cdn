[package]
name = "steam-vent-cdn"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.101"
base64 = "0.22.1"
byteorder = "1.5.0"
bytes = "0.6"
clap = { version = "4.5.58", features = ["derive"] }
crc = "3.4.0"
ecb = "0.1.2"
env_logger = "0.11.9"
futures = "0.3"
hex = "0.4.3"
indicatif = "0.18.3"
lzma-rs = "0.3.0"
log = "0.4.29"
prost = "0.14.3"
reqwest = { version = "0.13.2", features = [
    "json",
    "rustls",
    "multipart",
    "blocking",
] }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.139"
sha1 = "0.10.6"
thiserror = "1.0"
tokio = { version = "1.49.0", features = ["full"] }
tokio-stream = "0.1.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = "2.2.2"
aes = "0.8.3"
cbc = "0.1.2"
steam-vent = { git = "https://codeberg.org/eva828/steam-vent.git", branch = "main" }
steam-vent-proto = "0.5.2"
tracing-appender = "0.2.4"
