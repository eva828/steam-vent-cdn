[package]
name = "steam-vent-cdn"
version = "0.1.0"
edition = "2024"
description = "Download Steam Workshop items via Steam CDN"
license = "MIT"
repository = "https://github.com/eva828/SteamVentCdn"
readme = "README.md"
autoexamples = false

[dependencies]
base64 = "0.22.1"
clap = { version = "4.5.58", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4.3"
indicatif = "0.18.3"
lzma-rs = "0.3.0"
reqwest = { version = "0.13.2", features = [
    "rustls",
    "http2",
] }
thiserror = "1.0"
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }
tracing-indicatif = "0.3"
zip = "2.2.2"
adler2 = "2.0.1"
aes = "0.8.3"
cbc = "0.1.2"
steam-vent = "0.5.0"
steam-vent-proto = "0.5.2"
tracing-appender = "0.2.4"
rpassword = "7.4.0"
zstd = "0.13.3"
parking_lot = "0.12.5"
rayon = "1.11.0"
time = { version = "0.3", features = ["macros"] }
url = "2"

[[example]]
name = "list_versions"
path = "examples/metadata/list_versions.rs"

[[example]]
name = "list_files"
path = "examples/metadata/list_files.rs"

[[example]]
name = "item_metadata"
path = "examples/metadata/item_metadata.rs"

[[example]]
name = "basic_download"
path = "examples/download/basic_download.rs"

[[example]]
name = "authenticated_download"
path = "examples/download/authenticated_download.rs"

[[example]]
name = "download_specific_version"
path = "examples/download/download_specific_version.rs"

[[example]]
name = "download_manifest_by_id"
path = "examples/download/download_manifest_by_id.rs"

[[example]]
name = "app_download"
path = "examples/download/app_download.rs"

[[example]]
name = "batch_download"
path = "examples/download/batch_download.rs"

[[example]]
name = "stream_to_memory"
path = "examples/streaming/stream_to_memory.rs"

[[example]]
name = "random_access_reader"
path = "examples/streaming/random_access_reader.rs"

[[example]]
name = "progress_callback"
path = "examples/configuration/progress_callback.rs"

[[example]]
name = "advanced_config"
path = "examples/configuration/advanced_config.rs"

[[example]]
name = "error_handling"
path = "examples/configuration/error_handling.rs"

[dev-dependencies]
anyhow = "1"
